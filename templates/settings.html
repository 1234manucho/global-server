{% extends 'base.html' %}
{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <h1 class="text-2xl font-bold text-white border-b border-gray-700 pb-2">System Settings</h1>
    
    <div class="bg-[#111b2e] border border-gray-700 rounded shadow-lg overflow-hidden">
        <div class="bg-[#0a1226] px-6 py-3 border-b border-gray-700">
            <h2 class="text-white font-semibold">API & Node Configuration</h2>
        </div>
        <div class="p-6 space-y-4">
            <div class="grid grid-cols-3 gap-4 items-center">
                <label class="text-gray-400 text-sm">USDT TRC20 Wallet</label>
                <input type="text" value="{{ config['USDT_TRC20_WALLET'] if config else 'TXYZ123...' }}" class="col-span-2 bg-[#0a1226] border border-gray-600 rounded px-3 py-2 text-sm text-white font-mono" readonly>
            </div>
            <div class="grid grid-cols-3 gap-4 items-center">
                <label class="text-gray-400 text-sm">Node Environment</label>
                <select class="col-span-2 bg-[#0a1226] border border-gray-600 rounded px-3 py-2 text-sm text-white">
                    <option>Production (Live)</option>
                    <option>Staging (Testnet)</option>
                </select>
            </div>
            <div class="grid grid-cols-3 gap-4 items-center">
                <label class="text-gray-400 text-sm">Conversion Timer (Hours)</label>
                <input type="number" value="5" class="col-span-2 bg-[#0a1226] border border-gray-600 rounded px-3 py-2 text-sm text-white">
            </div>
        </div>
        <div class="bg-[#0a1226] px-6 py-3 border-t border-gray-700 text-right">
            <button class="bg-[#1d4ed8] hover:bg-blue-600 text-white px-6 py-2 rounded text-sm transition">Save Changes</button>
        </div>
    </div>
</div>
{% endblock %}
