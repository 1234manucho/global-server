{% extends 'base.html' %}
{% block content %}
<div class="max-w-7xl mx-auto">
    <h1 class="text-2xl font-bold mb-6 text-white border-b border-gray-700 pb-2">Payment Messages (MT101)</h1>
    <div class="bg-[#111b2e] rounded border border-gray-700 shadow-lg overflow-hidden">
        <div class="p-4 bg-[#0a1226] border-b border-gray-700 flex justify-between items-center">
            <span class="text-sm text-gray-400 font-mono">Live Feed: SWIFT / VISA Network</span>
            <span class="bg-green-900 text-green-300 text-xs px-2 py-1 rounded">LISTENING</span>
        </div>
        <table class="w-full text-left text-sm">
            <thead class="bg-[#111b2e] text-gray-400 border-b border-gray-700">
                <tr>
                    <th class="p-3">Message ID</th>
                    <th class="p-3">Sender BIC</th>
                    <th class="p-3">Receiver BIC</th>
                    <th class="p-3">Amount</th>
                    <th class="p-3">Status</th>
                </tr>
            </thead>
            <tbody class="font-mono text-gray-300">
                <tr class="border-b border-gray-800 hover:bg-[#1e293b]">
                    <td class="p-3">MSG-9921-XA</td>
                    <td class="p-3">BARCGB22XXX</td>
                    <td class="p-3">VISAUS33XXX</td>
                    <td class="p-3 text-green-400">$1,000,000.00</td>
                    <td class="p-3"><span class="bg-green-900/50 text-green-400 px-2 py-0.5 rounded text-xs">DELIVERED</span></td>
                </tr>
                <tr class="border-b border-gray-800 hover:bg-[#1e293b]">
                    <td class="p-3">MSG-9922-BQ</td>
                    <td class="p-3">DEUTDEFFXXX</td>
                    <td class="p-3">VISAUS33XXX</td>
                    <td class="p-3 text-green-400">$4,500,000.00</td>
                    <td class="p-3"><span class="bg-yellow-900/50 text-yellow-400 px-2 py-0.5 rounded text-xs">PROCESSING</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
