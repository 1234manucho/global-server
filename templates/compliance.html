{% extends 'base.html' %}
{% block content %}
<div class="max-w-7xl mx-auto space-y-4">
    <h1 class="text-2xl font-bold text-white border-b border-gray-700 pb-2">Compliance & KYC</h1>
    
    <div class="grid grid-cols-3 gap-4">
        <div class="bg-[#111b2e] border border-gray-700 p-4 rounded shadow-lg">
            <div class="flex items-center space-x-3 mb-2">
                <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                <h3 class="text-white font-semibold">AML Checks</h3>
            </div>
            <p class="text-xs text-gray-400 mb-2">Anti-Money Laundering engine active.</p>
            <div class="w-full bg-gray-800 rounded-full h-2">
                <div class="bg-green-500 h-2 rounded-full" style="width: 100%"></div>
            </div>
            <p class="text-right text-xs text-green-400 mt-1">100% Passed</p>
        </div>
        
        <div class="bg-[#111b2e] border border-gray-700 p-4 rounded shadow-lg">
            <div class="flex items-center space-x-3 mb-2">
                <svg class="w-5 h-5 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <h3 class="text-white font-semibold">KYC Verification</h3>
            </div>
            <p class="text-xs text-gray-400 mb-2">Identity verification for active clients.</p>
            <div class="w-full bg-gray-800 rounded-full h-2">
                <div class="bg-yellow-500 h-2 rounded-full" style="width: 85%"></div>
            </div>
            <p class="text-right text-xs text-yellow-400 mt-1">85% Verified</p>
        </div>

        <div class="bg-[#111b2e] border border-gray-700 p-4 rounded shadow-lg">
            <div class="flex items-center space-x-3 mb-2">
                <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <h3 class="text-white font-semibold">Fraud Alerts</h3>
            </div>
            <p class="text-xs text-gray-400 mb-2">Suspicious activity monitoring.</p>
            <div class="w-full bg-gray-800 rounded-full h-2">
                <div class="bg-red-500 h-2 rounded-full" style="width: 5%"></div>
            </div>
            <p class="text-right text-xs text-red-400 mt-1">1 Alert Pending</p>
        </div>
    </div>
</div>
{% endblock %}
