{% extends 'base.html' %}
{% block content %}
<div class="max-w-7xl mx-auto">
    <h1 class="text-2xl font-bold mb-6 text-white border-b border-gray-700 pb-2">Transaction Processing Engine</h1>
    <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="bg-[#111b2e] border border-gray-700 p-4 rounded shadow-lg text-center">
            <p class="text-gray-400 text-sm">Total Transactions Today</p>
            <p class="text-3xl font-bold text-white mt-2">1,492</p>
        </div>
        <div class="bg-[#111b2e] border border-gray-700 p-4 rounded shadow-lg text-center">
            <p class="text-gray-400 text-sm">Total Volume (USD)</p>
            <p class="text-3xl font-bold text-green-400 mt-2">$42,910,000</p>
        </div>
    </div>
    <div class="bg-[#111b2e] border border-gray-700 rounded p-6 shadow-lg">
        <h2 class="text-white font-semibold mb-4">Processing Queue</h2>
        <div class="flex items-center space-x-4 mb-2">
            <span class="text-gray-400 text-sm w-24">MT103 Batch</span>
            <div class="flex-1 bg-gray-800 rounded-full h-4">
                <div class="bg-blue-600 h-4 rounded-full" style="width: 75%"></div>
            </div>
            <span class="text-white text-sm font-mono">75%</span>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-gray-400 text-sm w-24">Settlement</span>
            <div class="flex-1 bg-gray-800 rounded-full h-4">
                <div class="bg-green-600 h-4 rounded-full" style="width: 45%"></div>
            </div>
            <span class="text-white text-sm font-mono">45%</span>
        </div>
    </div>
</div>
{% endblock %}
