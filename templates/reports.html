{% extends 'base.html' %}
{% block content %}
<div class="max-w-7xl mx-auto space-y-4">
    <div class="flex justify-between items-center border-b border-gray-700 pb-2">
        <h1 class="text-2xl font-bold text-white">Financial Reports</h1>
        <div class="flex space-x-2">
            <button class="bg-[#1e293b] border border-gray-600 hover:bg-gray-700 text-white px-3 py-1 rounded text-sm transition flex items-center">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> Export CSV
            </button>
            <button class="bg-[#1d4ed8] hover:bg-blue-600 text-white px-3 py-1 rounded text-sm transition flex items-center">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg> Print PDF
            </button>
        </div>
    </div>
    <div class="bg-[#111b2e] border border-gray-700 p-8 rounded shadow-lg text-center">
        <svg class="w-16 h-16 text-gray-600 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        <h2 class="text-xl text-gray-300 font-semibold mb-2">Report Generation Engine</h2>
        <p class="text-gray-500 mb-4">Select a date range to generate detailed transaction and settlement reports.</p>
        <div class="flex justify-center space-x-2">
            <input type="date" class="bg-[#0a1226] border border-gray-600 rounded px-3 py-2 text-sm text-white">
            <input type="date" class="bg-[#0a1226] border border-gray-600 rounded px-3 py-2 text-sm text-white">
            <button class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded text-sm transition">Generate</button>
        </div>
    </div>
</div>
{% endblock %}
