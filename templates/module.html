{% extends 'base.html' %}
{% block content %}
<div class="max-w-7xl mx-auto">
    <h1 class="text-2xl font-bold mb-6 text-white border-b border-gray-700 pb-2 flex items-center">
        {{ page_title }}
    </h1>
    <div class="bg-[#111b2e] border border-gray-700 rounded-sm p-10 text-center shadow-lg">
        <svg class="w-16 h-16 text-blue-500/50 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
        <h2 class="text-xl text-gray-300 font-semibold mb-2">Module Under Construction</h2>
        <p class="text-gray-500 mb-6">The <strong>{{ page_title }}</strong> module is currently being integrated into the VISA Global Server network.</p>
        <a href="{{ url_for('admin') if session.get('admin_logged_in') else url_for('dashboard') }}" class="inline-block bg-[#1d4ed8] hover:bg-blue-600 text-white font-bold py-2 px-6 rounded transition">Return to Dashboard</a>
    </div>
</div>
{% endblock %}
